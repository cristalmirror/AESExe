[package]
name = "aesexe"
version = "0.4.0"
edition = "2024"
description = "Cifrado de archivos AES y ChaCha20 con CLI y servidor HTTPS"
license = "MIT"

[dependencies]
base64 = "0.22.1"
rand = "0.9.4"
rustls = "0.22.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = true
strip = true

